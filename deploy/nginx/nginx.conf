# Bloco 1: Recebe requisições HTTP normais (porta 80) e joga para HTTPS
server {
    listen 80;
    server_name api-siatt.duckdns.org;

    # Redirecionamento automático para HTTPS
    return 301 https://$host$request_uri;
}

# Bloco 2: Configuração segura com SSL (porta 443) e Alta Performance
server {
    listen 443 ssl;
    server_name api-siatt.duckdns.org;

    # Caminhos dos certificados (o container agora acha eles aqui dentro)
    ssl_certificate /etc/letsencrypt/live/api-siatt.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-siatt.duckdns.org/privkey.pem;

    # -----------------------------------------------------------
    # OTIMIZAÇÕES DE PERFORMANCE (O "Turbinador" do Stalled)
    # -----------------------------------------------------------
    
    # 1. Cache de Sessão SSL (Evita refazer a criptografia toda hora)
    ssl_session_cache shared:SSL:10m; 
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 2. Configurações recomendadas e rápidas de segurança do SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 3. Mantém a conexão TCP aberta para o navegador não ter que reconectar
    keepalive_timeout 65;

    # 4. Compacta o JSON para viajar mais rápido pela internet
    gzip on;
    gzip_vary on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 256;
    # -----------------------------------------------------------

    location / {
        proxy_pass http://backend:8000; # Repassa para o container do Django
        
        # Otimiza a conexão interna entre o Nginx e o Gunicorn (Django)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000; # Repassa para o container do Grafana
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Configuração obrigatória para o funcionamento dos WebSockets do Grafana Live (Alertas e Realtime)
    location /grafana/api/live/ws {
        proxy_pass http://grafana:3000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
        # Faz cache no navegador para arquivos estáticos não precisarem ser baixados de novo
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}