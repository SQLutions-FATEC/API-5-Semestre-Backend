server {
    listen 80;
    server_name api-siatt.duckdns.org;

    # Necessário para as futuras renovações automáticas do Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Configuração do Servidor Seguro HTTPS (porta 443)
server {
    listen 443 ssl;
    server_name api-siatt.duckdns.org;

    # Caminhos exatos que o seu Certbot acabou de listar
    ssl_certificate /etc/letsencrypt/live/api-siatt.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-siatt.duckdns.org/privkey.pem;

    # Configurações recomendadas de segurança SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # Avisa o Django que a conexão é HTTPS
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}

