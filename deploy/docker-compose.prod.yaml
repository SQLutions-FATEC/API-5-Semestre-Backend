version: '3.8'

services:
  # -------------------- Backend (Django + Gunicorn) --------------------
  backend:
    build:
      context: ../django
      dockerfile: ../deploy/backend/Dockerfile
    container_name: django-prod
    restart: always
    command: gunicorn api.wsgi:application --bind 0.0.0.0:8000 --workers 3
    expose:
      - "8000"
    env_file:
      - ../.env
    environment:
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

# -------------------- Proxy Reverso (Nginx) --------------------
  nginx:
    image: nginx:latest
    container_name: nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"  # 1. LIBERA A PORTA HTTPS PARA O MUNDO EXTERNO
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # 2. MAPEIA OS CERTIFICADOS DA EC2 PARA DENTRO DO CONTAINER
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
    depends_on:
      - backend
volumes:
  static_volume:
  media_volume:

