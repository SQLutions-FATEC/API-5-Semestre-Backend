version: '3.8'

services:
  # -------------------- Backend (Django + Gunicorn) --------------------
  backend:
    build:
      context: ../django           
      dockerfile: ../deploy/backend/Dockerfile
    container_name: django-prod
    restart: always
    # Comando de produção rodando o Gunicorn
    command: gunicorn api.wsgi:application --bind 0.0.0.0:8000 --workers 3
    expose:
      - "8000"
    env_file:
      - ../.env                     # CORRIGIDO: Volta uma pasta para achar o .env na raiz
    environment:
      # Puxando exatamente os nomes que estão no seu .env
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_HOST=${DB_HOST}         
      - DB_PORT=${DB_PORT}         
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  # -------------------- Proxy Reverso (Nginx) --------------------
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443" # Porta do HTTPS liberada
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - backend

volumes:
  static_volume:
  media_volume:

