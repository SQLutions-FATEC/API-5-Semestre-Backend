version: '3.8'

services:
  # -------------------- Backend (Django + Gunicorn) --------------------
  backend:
    build:
      context: ../django            # Volta uma pasta e entra no código do Django
      dockerfile: ../deploy/backend/Dockerfile
    container_name: django-prod
    restart: always
    # Comando de produção rodando o Gunicorn
    command: gunicorn api.wsgi:application --bind 0.0.0.0:8000 --workers 3
    expose:
      - "8000" 
    env_file:
      - ../.env                     # CORRIGIDO: Volta uma pasta para achar o .env na raiz
    environment:
      # Puxando exatamente os nomes que estão no seu .env
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_HOST=${DB_HOST}          # CORRIGIDO: Agora puxa o DB_HOST correto do .env
      - DB_PORT=${DB_PORT}          # CORRIGIDO: Puxa a porta 3306 do .env
    volumes:
      - static_volume:/app/staticfiles 
      - media_volume:/app/media

  # -------------------- Proxy Reverso (Nginx) --------------------
  nginx:
    image: nginx:latest
    container_name: nginx-prod
    restart: always
    ports:
      - "80:80"
    volumes:
      # Puxa o conf da pasta ./nginx
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - backend

volumes:
  static_volume:
  media_volume: