services:
  # -------------------- Backend --------------------
  backend:
    build:
      context: ../django
      dockerfile: ../deploy/backend/Dockerfile
    container_name: django-app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_HOST=custom-mysql
      - DB_PORT=3306
      - RUN_SEED=${RUN_SEED:-false}
    depends_on:
      custom-mysql:
        condition: service_healthy
    volumes:
      - ../django:/app

  # -------------------- Frontend --------------------
  frontend:
    build:
      context: ./frontend
      args:
        # Usa a variável do .env ou assume 'main' como padrão
        - FRONTEND_BRANCH=${FRONTEND_BRANCH:-main}
        # Substitua pela URL real do repositório de frontend do 5º semestre
        - REPO_URL=https://github.com/SQLutions-FATEC/API-5-Semestre-Frontend
    container_name: nextjs-app
    command: npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend

  # -------------------- Database --------------------
  custom-mysql:
    build:
      context: ./mysql
    container_name: mysql-db
    environment:
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysqldata:


