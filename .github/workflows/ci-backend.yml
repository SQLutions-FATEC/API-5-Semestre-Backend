name: Backend CI

on:
  pull_request:
    branches:
      - develop-1
      - develop-2
      - develop-3
      - develop-4
    types: [opened, synchronize, reopened]

jobs:
  commit-build:
    name: "Estágio 1: Commit Build (Rápido)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: django/requirements.txt

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-django

      - name: Análise Estática (Linter)
        run: flake8 . --config=../.flake8

      - name: Executar Testes Unitários
        run: python -m pytest --ignore=api/tests/ --ignore=etl/tests/test_extraction.py

  secondary-build:
    name: "Estágio 2: Secondary Build (Ambiente de Integração Automatizado)"
    runs-on: ubuntu-latest
    needs: commit-build
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Criar arquivo de ambiente (.env) para o Docker
        run: |
          mkdir -p deploy
          cat > deploy/.env <<'EOF'
          MYSQL_USER=sqlutions
          MYSQL_PASSWORD=senha_padrao
          MYSQL_DATABASE=api_db
          MYSQL_ROOT_PASSWORD=senha_root_padrao
          DJANGO_SECRET_KEY=ci-secret
          RUN_SEED=false
          FRONTEND_BRANCH=develop-4
          NEXT_PUBLIC_API_URL=http://localhost:8000
          EOF

      - name: Automatizar Ambiente de Testes de Integração (Docker Compose)
        run: |
          echo "Aguardando o banco de dados iniciar..."
          for i in {1..30}; do
            CONTAINER_ID=$(docker compose -f deploy/docker-compose.yaml ps -q custom-mysql)
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER_ID" 2>/dev/null || echo "starting")
            if [ "$STATUS" = "healthy" ]; then
              echo "Banco de dados pronto!"
              exit 0
            fi
            sleep 2
          done
          echo "Erro: O banco de dados demorou muito para iniciar."
          docker compose -f deploy/docker-compose.yaml logs custom-mysql
          exit 1

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r django/requirements.txt
          pip install pytest pytest-django coverage pandas

      - name: Executar Migrações do Banco (Evolutionary DB)
        working-directory: django
        run: python manage.py smart_migrate

      - name: Executar Testes e Gerar Coverage
        working-directory: django
        run: |
          coverage run --source='api,etl' -m pytest
          coverage report -m
          coverage xml -o coverage.xml
          
          sed -i "s|<source>.*</source>|<source>$GITHUB_WORKSPACE</source>|g" coverage.xml
          sed -i 's/filename="/filename="django\//g' coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
