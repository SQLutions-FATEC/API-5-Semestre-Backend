name: Backend CI

on:
  pull_request:
    branches:
      - develop-1
      - develop-2
      - develop-3
      - develop-4
    types: [opened, synchronize, reopened]

jobs:
  commit-build:
    name: "Estágio 1: Commit Build (Rápido)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: django/requirements.txt

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-django

      - name: Análise Estática (Linter)
        run: flake8 . --config=../.flake8

      - name: Executar Testes Unitários
        run: python -m pytest --ignore=api/tests/ --ignore=etl/tests/

  secondary-build:
    name: "Estágio 2: Secondary Build (Integração Automatizada via Docker)"
    runs-on: ubuntu-latest
    needs: commit-build
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Criar arquivo de ambiente (.env) para o Docker
        run: |
          mkdir -p deploy
          cat > deploy/.env <<'EOF'
          MYSQL_USER=sqlutions
          MYSQL_PASSWORD=senha_padrao
          MYSQL_DATABASE=api_db
          MYSQL_ROOT_PASSWORD=senha_root_padrao
          DJANGO_SECRET_KEY=ci-secret
          RUN_SEED=false
          FRONTEND_BRANCH=develop-4
          NEXT_PUBLIC_API_URL=http://localhost:8000
          EOF

      - name: Executar Testes de Integração (Docker Compose)
        working-directory: deploy
        run: docker compose -f docker-compose.test.yml --env-file .env up --build --abort-on-container-exit

      - name: Encerrar containers de teste (Limpeza)
        working-directory: deploy
        if: always() # Garante que os recursos serão limpos mesmo se o passo anterior falhar
        run: docker compose -f docker-compose.test.yml down -v

      - name: Validate coverage file
        run: |
          test -f django/coverage.xml
          echo "coverage.xml found"  

      - name: Debug coverage
        run: |
          echo "workspace: $GITHUB_WORKSPACE"
          echo ""
          echo "coverage location:"
          find . -name coverage.xml
          echo ""
          echo "first lines:"
          sed -n '1,80p' django/coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}