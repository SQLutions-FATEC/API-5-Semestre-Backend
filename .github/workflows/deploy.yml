name: Deploy Automático 

on:
  push:
    branches:
      - develop-3

jobs:
  # -------------------------------------------------------------
  # 1. VALIDAÇÃO: BANCO, TESTES E SONARCLOUD
  # -------------------------------------------------------------
  test-and-sonar:
    name: Rodar Testes e SonarCloud
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: api_db
          MYSQL_ROOT_PASSWORD: senha_root_padrao
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential
          python -m pip install --upgrade pip
          pip install -r django/requirements.txt
          pip install coverage pandas

      - name: Run tests and generate coverage report
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          MYSQL_DATABASE: api_db
          MYSQL_USER: root
          MYSQL_PASSWORD: senha_root_padrao
          DJANGO_SECRET_KEY: 'test-secret-key-for-github-actions'
        run: |
          cd django
          coverage run --source='api,etl' manage.py test
          coverage report -m
          coverage xml -o coverage.xml
          
          sed -i "s|<source>.*</source>|<source>$GITHUB_WORKSPACE</source>|g" coverage.xml
          sed -i 's/filename="/filename="django\//g' coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # -------------------------------------------------------------
  # 2. DEPLOY: Só executa se o job anterior passar
  # -------------------------------------------------------------
  deploy:
    name: Atualizar EC2
    runs-on: ubuntu-latest
    needs: test-and-sonar 

    steps:
      - name: Executar comandos via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Entra na pasta raiz do projeto na EC2
            cd /home/ubuntu/API-5-Semestre-Backend
            
            # Atualiza a lista de mudanças do GitHub
            git fetch --all
            
            # Força o servidor a espelhar a branch develop-3 (evita conflitos)
            git reset --hard origin/develop-3
            
            # Entra na pasta deploy onde criamos o docker-compose de produção
            cd deploy
            
            # Derruba os containers antigos, se existirem
            docker-compose -f docker-compose.prod.yaml down
            
            # Reconstrói a imagem com o código novo e sobe os serviços em background (-d)
            docker-compose -f docker-compose.prod.yaml up -d --build
            
            # Limpa imagens "órfãs" antigas para não lotar o HD da EC2 com o tempo
            docker image prune -f