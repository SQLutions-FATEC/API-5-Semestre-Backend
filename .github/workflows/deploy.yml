name: Deploy Automático 

on:
  push:
    branches:
      - develop-4 

jobs:
  # -------------------------------------------------------------
  # 1. VALIDAÇÃO: BANCO, TESTES E SONARCLOUD
  # -------------------------------------------------------------
  test-and-sonar:
    name: Rodar Testes e SonarCloud
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: api_db
          MYSQL_ROOT_PASSWORD: senha_root_padrao
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential
          python -m pip install --upgrade pip
          pip install -r django/requirements.txt
          pip install coverage pandas

      - name: Run tests and generate coverage report
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          MYSQL_DATABASE: api_db
          MYSQL_USER: root
          MYSQL_PASSWORD: senha_root_padrao
          DJANGO_SECRET_KEY: 'test-secret-key-for-github-actions'
        run: |
          cd django
          coverage run --source='api,etl' -m pytest
          coverage report -m
          coverage xml -o coverage.xml
          
          sed -i "s|<source>.*</source>|<source>$GITHUB_WORKSPACE</source>|g" coverage.xml
          sed -i 's/filename="/filename="django\//g' coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
# -------------------------------------------------------------
  # 2. DEPLOY: Só executa se o job anterior passar
  # -------------------------------------------------------------
  deploy:
    name: Deploy para AWS ECS Fargate
    runs-on: ubuntu-latest
    needs: test-and-sonar 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, e Push das Imagens para o ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # 1. Backend Django (Note que o contexto é a pasta ./django como era no seu compose)
          docker build -t $ECR_REGISTRY/api-backend:latest -f deploy/backend/Dockerfile ./django
          docker push $ECR_REGISTRY/api-backend:latest

          # 2. Nginx
          docker build -t $ECR_REGISTRY/api-nginx:latest deploy/nginx
          docker push $ECR_REGISTRY/api-nginx:latest

          # 3. Prometheus
          docker build -t $ECR_REGISTRY/api-prometheus:latest deploy/monitoring/prometheus
          docker push $ECR_REGISTRY/api-prometheus:latest

          # 4. Grafana
          docker build -t $ECR_REGISTRY/api-grafana:latest deploy/monitoring/grafana
          docker push $ECR_REGISTRY/api-grafana:latest

          # 5. MySQL Exporter
          docker build -t $ECR_REGISTRY/api-mysql-exporter:latest deploy/monitoring/mysql-exporter
          docker push $ECR_REGISTRY/api-mysql-exporter:latest

      - name: Atualizar o Serviço no ECS
        run: |
          # Este comando avisa a AWS para baixar as imagens novas e reiniciar os containers sem downtime
          aws ecs update-service \
            --cluster meu-cluster-api \
            --service meu-servico-api \
            --force-new-deployment