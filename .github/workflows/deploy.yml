name: Deploy Automático 

# A pipeline vai rodar quando houver PUSH na develop-3
on:
  push:
    branches:
      - develop-3

jobs:
  deploy:
    name: Atualizar EC2
    runs-on: ubuntu-latest

    steps:
      - name: Executar comandos via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Entra na pasta raiz do projeto na EC2
            cd /home/ubuntu/API-5-Semestre-Backend
            
            # Atualiza a lista de mudanças do GitHub
            git fetch --all
            
            # Força o servidor a espelhar a branch develop-3 (evita conflitos)
            git reset --hard origin/develop-3
            
            # Entra na pasta deploy onde criamos o docker-compose de produção
            cd deploy
            
            # Derruba os containers antigos, se existirem
            docker-compose -f docker-compose.prod.yaml down
            
            # Reconstrói a imagem com o código novo e sobe os serviços em background (-d)
            docker-compose -f docker-compose.prod.yaml up -d --build
            
            # Limpa imagens "órfãs" antigas para não lotar o HD da EC2 com o tempo
            docker image prune -f