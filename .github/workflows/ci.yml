name: CI

on:
  push:
    branches:
      - 127-DevOps--Backend-CI

jobs:
  commit-build:
    name: "Estágio 1: Commit Build (Rápido)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: django/requirements.txt

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest-django

      - name: Análise Estática (Linter)
        run: flake8 . --exclude=migrations

      - name: Testes Unitários (Sem Banco)
        # Executa testes ignorando os que dependem de banco de dados
        run: python -m pytest -m "not integration and not django_db"

  secondary-build:
    name: "Estágio 2: Secondary Build (Banco & Integração)"
    runs-on: ubuntu-latest
    needs: commit-build
    env:
      MYSQL_USER: sqlutions
      MYSQL_PASSWORD: senha_padrao
      MYSQL_DATABASE: api_db
      MYSQL_ROOT_PASSWORD: senha_root_padrao
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DJANGO_SECRET_KEY: ci-secret
      RUN_SEED: "false"
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: django/requirements.txt

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential

      - name: Criar arquivo de ambiente (.env) para o Docker
        run: |
          mkdir -p deploy
          cat > deploy/.env <<'EOF'
          MYSQL_USER=sqlutions
          MYSQL_PASSWORD=senha_padrao
          MYSQL_DATABASE=api_db
          MYSQL_ROOT_PASSWORD=senha_root_padrao
          DB_HOST=custom-mysql
          DB_PORT=3306
          RUN_SEED=false
          DJANGO_SECRET_KEY=ci-secret
          FRONTEND_BRANCH=develop-1
          NEXT_PUBLIC_API_URL=http://localhost:8000
          EOF

      - name: Inicializar Banco de Dados (Docker)
        run: docker compose -f deploy/docker-compose.yaml up -d custom-mysql

      - name: Aguardar prontidão do Banco de Dados (Healthcheck)
        run: |
          echo "Aguardando o banco de dados iniciar..."
          for i in {1..30}; do
            # Busca o container dinamicamente pelo serviço do compose para evitar quebras de nome
            CONTAINER_ID=$(docker compose -f deploy/docker-compose.yaml ps -q custom-mysql)
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER_ID" 2>/dev/null || echo "starting")
            if [ "$STATUS" = "healthy" ]; then
              echo "Banco de dados pronto!"
              exit 0
            fi
            sleep 2
          done
          echo "Erro: O banco de dados demorou muito para iniciar."
          docker compose -f deploy/docker-compose.yaml logs custom-mysql
          exit 1

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r django/requirements.txt

      - name: Executar Migrações do Banco (Evolutionary DB)
        working-directory: django
        run: python manage.py migrate

      - name: Executar Testes de Integração Completos
        working-directory: django
        run: python -m pytest